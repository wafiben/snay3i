name: Node.js CI

on:
  push:
    branches:
      - 'feature/**'
  pull_request:
    branches:
      - 'feature/**'
      - 'main'

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: snei3i
          POSTGRES_PASSWORD: snei3i
          POSTGRES_DB: snei3i_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd="pg_isready -U snei3i"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.3
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Wait for PostgreSQL to be ready
        run: |
          sudo apt-get install -y postgresql-client
          until pg_isready -h localhost -p 5434 -U snei3i; do
            echo "⏳ Waiting for PostgreSQL..."
            sleep 2
          done
          echo "✅ PostgreSQL is ready!"

      - name: Verify database exists (create if missing)
        run: |
          PGPASSWORD=snei3i psql -h localhost -p 5434 -U snei3i -d postgres -tc "SELECT 1 FROM pg_database WHERE datname = 'snei3i_test'" | grep -q 1 || \
          PGPASSWORD=snei3i psql -h localhost -p 5434 -U snei3i -d postgres -c "CREATE DATABASE snei3i_test;"
        

      - name: Run unit tests
        run: npm run test

      - name: Run e2e tests
        env:
          NODE_ENV: test
          CI: true
          DB_HOST: localhost
          DB_PORT: 5434
          DB_USERNAME: snei3i
          DB_PASSWORD: snei3i
          DB_NAME: snei3i_test
        run: npm run test:e2e

      - name: Build application

        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        run: npm run build    
